<!DOCTYPE html>
<html>
<head>
    <title>Hello App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            text-align: center;
            color: green;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Add Two Numbers please</h1>

    <form method="POST">
        <input type="number" step="any" name="a" placeholder="First number" required>

        <input type="number" step="any" name="b" placeholder="Second number" required>

        <button type="submit">Add</button>
    </form>

    {% if result is not none %}
        <div class="result">
            Result = {{ result }}
        </div>
    {% endif %}
</div>

</body>
</html>
